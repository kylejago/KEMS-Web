name: Deploy kems.uk to IONOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public-site/**"
      - "brand/**"
      - "scripts/sync-approved-logo.mjs"
      - "package.json"
      - ".github/workflows/deploy-kems-uk.yml"

permissions:
  contents: read

concurrency:
  group: deploy-kems-uk-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public-site to IONOS /kems webspace
    runs-on: ubuntu-latest
    environment:
      name: kems.uk
      url: https://kems.uk
    env:
      REMOTE_DIR: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync exact KEMS SVG
        run: node scripts/sync-approved-logo.mjs

      - name: Verify public/private boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f public-site/index.html
          test -f public-site/logo.svg
          test "$(sha256sum public-site/logo.svg | awk '{print $1}')" = "ef53e22bdff4e4ebd81007c3a6d5f28da0384f547e9036a7be7e3bf2d420b464"
          if grep -RIE --exclude=README.md "HA_TOKEN|long-lived access token|long-lived token|localhost:8123|:4174|:4175" public-site; then
            echo "The public site contains a forbidden private credential/control reference." >&2
            exit 1
          fi

      - name: Install SFTP client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends lftp

      - name: Deploy public site to IONOS
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
        run: |
          set -euo pipefail
          : "${SFTP_HOST:?Missing IONOS_SFTP_HOST secret}"
          : "${SFTP_USER:?Missing IONOS_SFTP_USER secret}"
          : "${SFTP_PASSWORD:?Missing IONOS_SFTP_PASSWORD secret}"
          PORT="${SFTP_PORT:-22}"

          lftp <<EOF2
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          open -p ${PORT} -u "${SFTP_USER}","${SFTP_PASSWORD}" sftp://${SFTP_HOST}
          cd ${REMOTE_DIR}
          pwd
          mirror --reverse --delete --verbose --exclude-glob README.md public-site/ .
          cls -1
          bye
          EOF2

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### kems.uk deployment"
            echo ""
            echo "- Source: \`public-site/\`"
            echo "- Canonical KEMS SVG: SHA-256 verified before upload"
            echo "- Delayed demo client: https://demo-api.kems.uk/api/public-demo"
            echo "- Property login: Cloudflare Access App Launcher"
            echo "- SFTP-visible target: account root \`.\`"
            echo "- IONOS physical webspace: \`/kems\`"
            echo "- Public URL: https://kems.uk"
          } >> "$GITHUB_STEP_SUMMARY"
