name: Apply Web.8 catch-up

on:
  push:
    branches:
      - feature/alpha8-web.8-ha-parity-catchup

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply catch-up exactly once
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" = "0.8.0-alpha8-web.8" ]; then
            echo "Web.8 source is already applied."
            exit 0
          fi
          [ "$VERSION" = "0.8.0-alpha8-web.7" ] || { echo "Unexpected source version: $VERSION" >&2; exit 1; }
          node scripts/apply-web8-catchup.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Web.8: apply coordinated Pi/Public catch-up [web8-applied]"
          git push origin HEAD:feature/alpha8-web.8-ha-parity-catchup
