name: Fix bundle agent once

on:
  push:
    branches:
      - feature/unified-update-orchestrator
    paths:
      - .github/workflows/fix-bundle-agent-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-update-orchestrator
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Harden agent
        run: python scripts/fix_bundle_agent_once.py
      - name: Validate JavaScript
        run: node --check deploy/bundle-agent.mjs
      - name: Commit hardened agent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden coordinated Pi update verification"
          git push
