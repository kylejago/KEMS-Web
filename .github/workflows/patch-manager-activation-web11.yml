name: Patch manager activation web11

on:
  push:
    branches:
      - fix/manager-activation-version-web11

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manager-activation-version-web11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply web.11 activation fix
        shell: python
        run: |
          from pathlib import Path
          import json

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          if package.get('version') != '0.7.0-alpha6-web.10':
              raise SystemExit(f"Unexpected package version: {package.get('version')}")
          package['version'] = '0.7.0-alpha6-web.11'
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          manager_path = Path('deploy/manager.mjs')
          manager = manager_path.read_text()
          old_manager = 'const MANAGER_VERSION = "0.7.0-alpha6-web.8";'
          new_manager = 'const MANAGER_VERSION = installedVersion();'
          if old_manager not in manager:
              raise SystemExit('Expected hard-coded manager version was not found')
          manager_path.write_text(manager.replace(old_manager, new_manager, 1))

          agent_path = Path('deploy/bundle-agent.mjs')
          agent = agent_path.read_text()
          old_agent = 'const AGENT_VERSION = "0.7.0-alpha6-web.10";'
          new_agent = 'const AGENT_VERSION = "0.7.0-alpha6-web.11";'
          if old_agent not in agent:
              raise SystemExit('Expected web.10 agent version was not found')
          agent_path.write_text(agent.replace(old_agent, new_agent, 1))

          test_path = Path('scripts/pi-deployment-test.mjs')
          test = test_path.read_text()
          old_test = 'mustContain("deploy/manager.mjs", ["127.0.0.1", "kems-update", "kems-rollback", "systemctl", "latestRelease", "home-assistant", "ghcr.io/home-assistant/home-assistant:stable", "download.docker.com/linux/debian"]);'
          new_test = 'mustContain("deploy/manager.mjs", ["127.0.0.1", "kems-update", "kems-rollback", "systemctl", "latestRelease", "const MANAGER_VERSION = installedVersion()", "applianceActivationRequired: MANAGER_VERSION !== installed", "home-assistant", "ghcr.io/home-assistant/home-assistant:stable", "download.docker.com/linux/debian"]);'
          if old_test not in test:
              raise SystemExit('Expected manager deployment assertion was not found')
          test_path.write_text(test.replace(old_test, new_test, 1))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          heading = '''# Changelog\n\n## 0.7.0-alpha6-web.11 — Reliable appliance activation state\n\n- Fixes the stale “Reboot required” banner after KEMS Web updates by capturing the active appliance version when the Pi manager process starts instead of keeping a release-specific hard-coded manager version.\n- Preserves the activation check across future updates: the old manager process keeps reporting the version it started on until the service restarts, then the new manager reports the newly active website version.\n- Keeps coordinated Pi downgrade protection introduced in web.10 unchanged.\n- Prepared for the first fully automatic coordinated Pi website update test.\n\n'''
          if changelog.startswith('# Changelog\n'):
              changelog = heading + changelog[len('# Changelog\n\n'):]
          else:
              changelog = heading + changelog
          changelog_path.write_text(changelog)

          workflow = Path('.github/workflows/patch-manager-activation-web11.yml')
          workflow.unlink()

      - name: Validate
        run: npm test

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make appliance activation version restart-aware'
          git push origin HEAD:fix/manager-activation-version-web11
