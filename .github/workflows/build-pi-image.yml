name: Build KEMS Pi headless image

on:
  workflow_dispatch:
  push:
    paths:
      - 'image/**'
      - 'install.sh'
      - 'deploy/systemd/kems-web.service'
      - '.github/workflows/build-pi-image.yml'

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out KEMS Web
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils util-linux mount

      - name: Download and verify Raspberry Pi OS Lite 64-bit
        shell: bash
        run: |
          set -euo pipefail
          URL='https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-06-19/2026-06-18-raspios-trixie-arm64-lite.img.xz'
          EXPECTED='acff736ca7945e3b305f07cda4abdb870910e12634991da69783611756e381b3'
          curl -fL --retry 8 --retry-delay 5 "$URL" -o base.img.xz
          echo "$EXPECTED  base.img.xz" | sha256sum -c -
          xz -T0 -dk base.img.xz

      - name: Download and verify Node.js 22 ARM64 for the setup image
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt -o SHASUMS256.txt
          NODE_ARCHIVE=$(awk '$2 ~ /^node-v[0-9.]+-linux-arm64\.tar\.xz$/ {print $2; exit}' SHASUMS256.txt)
          test -n "$NODE_ARCHIVE"
          NODE_VERSION=${NODE_ARCHIVE#node-v}
          NODE_VERSION=${NODE_VERSION%-linux-arm64.tar.xz}
          curl -fsSL --retry 5 "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}" -o "$NODE_ARCHIVE"
          grep "  ${NODE_ARCHIVE}$" SHASUMS256.txt | sha256sum -c -
          echo "NODE_ARCHIVE=$NODE_ARCHIVE" >> "$GITHUB_ENV"

      - name: Inject resilient zero-touch KEMS bootstrap
        shell: bash
        run: |
          set -euo pipefail
          IMG=base.img
          ROOT="$RUNNER_TEMP/kems-root"
          BOOT="$RUNNER_TEMP/kems-boot"
          mkdir -p "$ROOT" "$BOOT"

          LOOP=$(sudo losetup --find --show --partscan "$IMG")
          cleanup() {
            sudo umount "$BOOT" 2>/dev/null || true
            sudo umount "$ROOT" 2>/dev/null || true
            sudo losetup -d "$LOOP" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo udevadm settle
          sleep 2
          sudo mount "${LOOP}p2" "$ROOT"
          sudo mount "${LOOP}p1" "$BOOT"

          # Pre-bake Node.js so port 4173 can show setup progress immediately,
          # before apt/GitHub installation has completed.
          sudo mkdir -p "$ROOT/usr/local/lib/node-v22"
          sudo tar -xJf "$NODE_ARCHIVE" --strip-components=1 -C "$ROOT/usr/local/lib/node-v22"
          for bin in node npm npx corepack; do
            sudo ln -sfn "/usr/local/lib/node-v22/bin/$bin" "$ROOT/usr/local/bin/$bin"
          done

          sudo install -m 0755 image/kems-firstboot.sh "$ROOT/usr/local/sbin/kems-firstboot"
          sudo install -m 0644 image/kems-firstboot.service "$ROOT/etc/systemd/system/kems-firstboot.service"
          sudo mkdir -p "$ROOT/usr/local/lib/kems-bootstrap"
          sudo install -m 0644 image/kems-setup-status.mjs "$ROOT/usr/local/lib/kems-bootstrap/kems-setup-status.mjs"
          sudo install -m 0644 image/kems-setup-status.service "$ROOT/etc/systemd/system/kems-setup-status.service"
          sudo mkdir -p "$ROOT/etc/systemd/system/multi-user.target.wants"
          sudo ln -sfn ../kems-firstboot.service "$ROOT/etc/systemd/system/multi-user.target.wants/kems-firstboot.service"
          sudo ln -sfn ../kems-setup-status.service "$ROOT/etc/systemd/system/multi-user.target.wants/kems-setup-status.service"
          sudo mkdir -p "$ROOT/var/lib/kems-bootstrap"
          cat <<'JSON' | sudo tee "$ROOT/var/lib/kems-bootstrap/status.json" >/dev/null
          {"state":"starting","stage":"boot","progress":5,"message":"Raspberry Pi has started. Preparing the KEMS installer…"}
          JSON

          echo 'kems-pi' | sudo tee "$ROOT/etc/hostname" >/dev/null
          if sudo grep -qE '^127\.0\.1\.1[[:space:]]+' "$ROOT/etc/hosts"; then
            sudo sed -i -E 's/^127\.0\.1\.1.*/127.0.1.1\tkems-pi/' "$ROOT/etc/hosts"
          else
            echo -e '127.0.1.1\tkems-pi' | sudo tee -a "$ROOT/etc/hosts" >/dev/null
          fi

          # Keep the image userless/headless but give cloud-init the hostname and
          # timezone expected by the appliance. Ethernet remains standard DHCP.
          if [[ -f "$BOOT/user-data" ]]; then
            sudo cp "$BOOT/user-data" "$BOOT/user-data.kems-original"
          fi
          cat <<'CLOUD' | sudo tee "$BOOT/user-data" >/dev/null
          #cloud-config
          hostname: kems-pi
          manage_etc_hosts: true
          timezone: Europe/London
          ssh_pwauth: false
          CLOUD

          sync
          cleanup
          trap - EXIT

      - name: Compress and checksum image
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME="KEMS-Pi-${VERSION}-headless.img.xz"
          mv base.img KEMS-Pi.img
          xz -T0 -9 KEMS-Pi.img
          mv KEMS-Pi.img.xz "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KEMS-Pi-headless-image
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          retention-days: 14

      - name: Publish/update Pi image release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          NAME: ${{ steps.package.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="pi-image-v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NAME" "$NAME.sha256" --clobber
          else
            gh release create "$TAG" "$NAME" "$NAME.sha256" \
              --target "$GITHUB_SHA" \
              --title "KEMS Pi headless image ${VERSION}" \
              --notes "Resilient zero-touch Raspberry Pi 4B image. Port 4173 shows live first-boot setup status immediately, then hands over to KEMS Web. Flash with Raspberry Pi Imager, connect Ethernet, and power on." \
              --prerelease
          fi
